[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]

# Pin the compiler so CI builds are byte-identical to local ones and
# any future opcode-set change is a conscious decision, not silent drift.
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true

[fuzz]
runs = 10_000

[invariant]
runs = 256
depth = 32
call_override = false
