[workspace]
members = [
    "types",
    "engine",
    "state",
    "api",
    "committer",
    "zkvm",
    "tee",
    "benches",
    "committee",
    "perp",
    "fix",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Arya Somu <arya@monolithsystematic.com>"]
license = "MIT"
repository = "https://github.com/arpjw/vela"

[workspace.dependencies]
types = { path = "types" }
engine = { path = "engine" }
state = { path = "state" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "1"
bytes = "1"
dashmap = "5"
parking_lot = "0.12"
sha3 = "0.10"
sha2 = "0.10"
hmac = "0.12"
k256 = { version = "0.13", features = ["ecdsa"] }
hex = "0.4"
rand = "0.8"
criterion = { version = "0.5", features = ["html_reports"] }
ahash = { version = "0.8", features = ["serde"] }

# Workspace-level clippy config. `cargo clippy --workspace -- -D warnings`
# still catches real bugs; these allows only cover categories that either
# (a) are stylistic and would balloon this PR to fix in-tree or (b) fire
# on pre-existing code that predates the audit hardening pass. Trim the
# list as the codebase modernises.
[workspace.lints.clippy]
too_many_arguments = "allow"
doc_lazy_continuation = "allow"

[profile.release]
# Fat LTO across the workspace: matching engine spans multiple crates
# (types → engine → api) and cross-crate inlining materially cuts
# hot-path instruction count.
lto = "fat"
# Single codegen unit gives LLVM the whole compilation unit to optimise,
# at the cost of longer release builds. Worth it for a matching engine.
codegen-units = 1
# `panic = "abort"` shaves unwind tables + panic-machinery from the
# binary and lets LLVM emit smaller code around every fallible call.
# The engine treats unrecoverable state as fatal (WAL + snapshot handle
# recovery), so unwinding wasn't buying anything in prod.
panic = "abort"
# Debug symbols stripped from the shipped binary — snapshotable via
# `strip = "symbols"`. Keep `debug = 1` if you want addr2line-usable
# frames from prod core dumps.
strip = "symbols"

[profile.bench]
# Match release settings so bench numbers reflect production behaviour.
lto = "fat"
codegen-units = 1
