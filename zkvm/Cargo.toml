[package]
name = "zkvm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
types = { workspace = true }
engine = { workspace = true }
state = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
sha3 = { workspace = true }
hex = { workspace = true }
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false, optional = true }

[features]
default = []
# Enables the HTTP-backed Sp1Prover implementation. Off by default so
# the default build stays wire-independent; api opts in when the
# operator sets VELA_SP1_PROVER_URL.
sp1-prover = ["dep:reqwest"]
